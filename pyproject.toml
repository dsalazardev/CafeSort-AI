[project]
name = "cafesort-ai"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "tensorflow[and-cuda]==2.22.0rc1; platform_system == 'Linux'",
    "tensorflow==2.22.0rc1; platform_system == 'Windows'",
    "tensorflow==2.22.0rc1; platform_system == 'Darwin'",
    "tf2onnx",
    "torch",
    "torchvision",
    "ultralytics",
    "opencv-python",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "onnx>=1.23.2",
    "onnxruntime",
    "onnxslim",
    "pyyaml",
    "Pillow",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
